<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- SweetAlert2 CSS -->

<!-- SweetAlert2 JavaScript -->

  -->
<link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div id="header">
        <center><h1>Categories</h1></center>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by category or name...">
        </div>
        <button id="allReviewsbtn">All Reviews</button>
    </div>





<!-- <a href="></a> -->
    <div class="container mt-5">
      <div class="row g-3">
          <div class="col-md-3" id="res_div">
              <div class="category-box" >
                  <img src="https://www.batihanvadi.com/content-image/galleries/auto-auto/113.jpg" alt="Restaurants">
                  <p>Restaurants</p>
              </div>
          </div>
          <div class="col-md-3"  id="shop_div">
              <div class="category-box"  class="shopping">
                  <img src="https://indian-retailer.s3.ap-south-1.amazonaws.com/s3fs-public/2021-05/revenge%20shopping.jpg" alt="Shopping">
                  <p>Shopping</p>
              </div>
          </div>
          <div class="col-md-3" id="night_div">
              <div class="category-box"  id="pub">
                  <img src="https://media-cdn.tripadvisor.com/media/photo-s/22/b8/fd/13/old-mates-british-pub.jpg" alt="Nightlife">
                  <p>Nightlife</p>
              </div>
          </div>
          <div class="col-md-3" id="jew_div">
              <div class="category-box"  id="restraunt">
                  <img src="https://bsmedia.business-standard.com/_media/bs/img/article/2024-05/09/full/1715241436-388.jpeg?im=FeatureCrop,size=(826,465)" alt="jwelery">
                  <p>jwelery</p>
              </div>
          </div>
     
      </div>
  </div>

  <div id="catWiseData"></div>



<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content animate__animated animate__fadeIn">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">Submit a Review</h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body">
                <p id="storeName" class="fw-bold"></p>
                <div class="rating-stars mb-2">
                    <i class="fa fa-star" data-value="1"></i>
                    <i class="fa fa-star" data-value="2"></i>
                    <i class="fa fa-star" data-value="3"></i>
                    <i class="fa fa-star" data-value="4"></i>
                    <i class="fa fa-star" data-value="5"></i>
                </div>
                <input type="text" placeholder="Your Name" id="name"></input> <br><br>

                <textarea id="reviewText" class="form-control mb-2" placeholder="Write your review..."></textarea>
               

            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="submitReview">Submit</button>
            </div>
        </div>
    </div>
</div>




<div id="allReviewsContainer">  <h2>All Reviews</h2>
    <table id="reviewTable">
        <thead>
            <tr>
                <th>Pepole</th>
                <th>storename</th>
                <th>Review Text</th>  
                <th>Rating</th>
                <!-- <th>Image</th> -->
            </tr>
        </thead>
        <tbody> </tbody>  </table>
</div>
  
  <script src="index.js"> </script>





</body>

</html>
