<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <script src="./landing.js"></script> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- SweetAlert2 CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

<!-- SweetAlert2 JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <style>
        body{
            background-color: #7AB2B2;
        }
      .category-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          border: 1px solid #ddd;
          border-radius: 10px;
          padding: 20px;
          text-align: center;
          transition: all 0.3s ease-in-out;
          cursor: pointer;
          background-color: #EEF7FF;
      }

      .category-box:hover {
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
          transform: translateY(-5px);
      }
      .category-box img {
          width: 100%;
          height: 100%;
      }

      .rating-stars i {
    font-size: 24px;
    color: gray;
    cursor: pointer;
    transition: color 0.3s;
}

.rating-stars i.selected {
    color: gold;
}
#header{
    display: flex;
    align-items: center;
    align-content: center;
    justify-content: space-evenly;

}



#reviewTable { /* Style the table */
            width: 50%;
            /* display: flex; */
            /* flex-direction: row; */
           
            align-content: center;
            border-collapse: collapse;
            margin-top: 20px;
            margin-left: 200px;
            /* padding: 100px; */
        }
        #reviewTable th, #reviewTable td {
            border: 1px solid #ddd;
            padding: 8px;
            /* text-align: left; */
            align-items: center;
        }
        #reviewTable th {
            background-color: #f2f2f2;
        }
        #allReviewsContainer { /* Initially hidden */
            display: none;
        }
    .search-container {
    margin: 20px;
    text-align: center;
    width:400px;
    }
    #searchInput {
    padding: 5px;
    width: 80%;
    font-size: 16px;
    border-radius: 6px;
    }
    #results {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
}

  </style>

</head>
<body>
    
    <div id="header">
        <center><h1>Categories</h1></center>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search by category or name...">
        </div>
        <button id="allReviewsbtn">All Reviews</button>
    </div>






    <div class="container mt-5">
      <div class="row g-3">
          <div class="col-md-3" id="res_div">
              <div class="category-box" >
                  <img src="https://www.batihanvadi.com/content-image/galleries/auto-auto/113.jpg" alt="Restaurants">
                  <p>Restaurants</p>
              </div>
          </div>
          <div class="col-md-3"  id="shop_div">
              <div class="category-box"  class="shopping">
                  <img src="https://indian-retailer.s3.ap-south-1.amazonaws.com/s3fs-public/2021-05/revenge%20shopping.jpg" alt="Shopping">
                  <p>Shopping</p>
              </div>
          </div>
          <div class="col-md-3" id="night_div">
              <div class="category-box"  id="pub">
                  <img src="https://media-cdn.tripadvisor.com/media/photo-s/22/b8/fd/13/old-mates-british-pub.jpg" alt="Nightlife">
                  <p>Nightlife</p>
              </div>
          </div>
          <div class="col-md-3" id="jew_div">
              <div class="category-box"  id="restraunt">
                  <img src="https://bsmedia.business-standard.com/_media/bs/img/article/2024-05/09/full/1715241436-388.jpeg?im=FeatureCrop,size=(826,465)" alt="jwelery">
                  <p>jwelery</p>
              </div>
          </div>
     
      </div>
  </div>

  <div id="catWiseData"></div>



<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content animate__animated animate__fadeIn">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">Submit a Review</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="storeName" class="fw-bold"></p>
                <div class="rating-stars mb-2">
                    <i class="fa fa-star" data-value="1"></i>
                    <i class="fa fa-star" data-value="2"></i>
                    <i class="fa fa-star" data-value="3"></i>
                    <i class="fa fa-star" data-value="4"></i>
                    <i class="fa fa-star" data-value="5"></i>
                </div>
                <textarea id="reviewText" class="form-control mb-2" placeholder="Write your review..."></textarea>
                <!-- <input type="file" id="uploadImage" class="form-control mb-2"> -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="submitReview">Submit</button>
            </div>
        </div>
    </div>
</div>




<div id="allReviewsContainer">  <h2>All Reviews</h2>
    <table id="reviewTable">
        <thead>
            <tr>
                <th>storename</th>
                <th>Review Text</th>  
                <th>Rating</th>
                <!-- <th>Image</th> -->
            </tr>
        </thead>
        <tbody> </tbody>  </table>
</div>
  
  <script src="index.js"> </script>





</body>

</html>
