<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Review & Rating Platform</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- <link rel="stylesheet" href="./landing/land.css"> -->

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }

        .navbar {
            background-color: #0D4DFF;
            padding: 15px 0;
        }

        .navbar img {
            max-width: 160px;
            height: auto;
        }

        .hero-section {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('../rough/Assets/Logos/bgimage.png') no-repeat center center/cover;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .hero-section h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: bold;
            color: #00FFA9;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .hero-section p {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
        }

        .hero-section button {
            padding: 12px 24px;
            background-color: #0D4DFF;
            color: white;
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 4px 10px rgba(13, 77, 255, 0.3);
        }

        .hero-section button:hover {
            background-color: #00FFA9;
            color: #0D4DFF;
            box-shadow: 0px 6px 15px rgba(0, 255, 169, 0.4);
        }

        .modal-content {
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .navbar img {
                max-width: 120px;
            }
            
            .hero-section {
                min-height: 80vh;
            }
        }

        @media (max-width: 576px) {
            .navbar img {
                max-width: 100px;
            }
            
            .hero-section {
                min-height: 70vh;
            }
            
            .navbar .btn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark animate__animated animate__fadeInDown">
    <div class="container">
        <img src="./Assets/Logos/cover.png" alt="LOGO" class="img-fluid"/>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <button class="btn btn-dark me-2 animate__animated animate__bounceIn" data-bs-toggle="modal" data-bs-target="#signupModal">Sign Up</button>
                </li>
                <li class="nav-item">
                    <button class="btn btn-dark animate__animated animate__bounceIn" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<div class="hero-section animate__animated animate__fadeIn">
    <div>
        <h1 class="animate__animated animate__zoomIn">Welcome to Review System</h1>
        <p class="animate__animated animate__fadeInUp">Customer feedback is the lifeblood of business growth.</p>
        <button class="animate__animated animate__pulse animate__infinite" onclick="swalWelcome()">Get Started</button>
    </div>
</div>

<!-- Signup Modal -->
<div class="modal fade" id="signupModal" tabindex="-1" aria-labelledby="signupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content animate__animated animate__zoomIn">
            <div class="modal-header">
                <h5 class="modal-title" id="signupModalLabel">Sign Up</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="signupForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="signupName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="signupEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="signupPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                    <div class="text-center mt-3">
                        Already have an account? <a href="#" data-bs-toggle="modal" data-bs-target="#loginModal" data-bs-dismiss="modal">Login here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content animate__animated animate__zoomIn">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">Login</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="loginEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Login</button>
                    <div class="text-center mt-3">
                        Don't have an account? <a href="#" data-bs-toggle="modal" data-bs-target="#signupModal" data-bs-dismiss="modal">Sign up here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./landing/land.js"></script>

<script>
    // Preserving your original functionality
    function swalWelcome() {
        Swal.fire({
            title: 'Welcome!',
            text: 'Thanks for visiting our review platform.',
            icon: 'info',
            confirmButtonText: 'Continue'
        });
    }
    
    // Your existing form handling code from land.js would go here
</script>
</body>
</html>
